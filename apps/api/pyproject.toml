[project]
name = "auteur-api"
version = "0.1.0"
description = "Auteur Education API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auteur_api"]

[tool.hatch.build.targets.wheel.sources]
"src/auteur_api" = "auteur_api"

[tool.uv]
package = true

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# CLI evidence output: long print lines are clearer unbroken.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Live tests cost tokens: run them explicitly with `uv run pytest -m live tests/live`.
addopts = "-m 'not live'"
markers = [
    "live: calls the real AI provider; skipped unless OPENAI_API_KEY is configured",
]
